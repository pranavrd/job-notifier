name: CI

on:
  # Run on main pushes and on every PR. Scoping push to main avoids a duplicate
  # run when a branch that already has an open PR is pushed to.
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
